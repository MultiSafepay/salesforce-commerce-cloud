# MultiSafepay storefront messages.
#
# REQ-1.4.4: the customer-facing text must stay generic. It must never disclose
# the cause (invalid/missing API key, HTTP status, ...) — that detail belongs in
# the Logger, where the merchant's technical staff can find it. Keep it identical
# for every configuration failure so the storefront cannot be used to probe the
# integration's state.
msp.error.unavailable=Online payment is temporarily unavailable. Please contact the store for assistance.
msp.error.nomethods=No payment methods are available for this order. Please contact the store for assistance.
