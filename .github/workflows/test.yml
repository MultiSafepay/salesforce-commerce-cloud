name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Connector tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The connector suite runs on Node's built-in test runner and needs no
      # installed dependencies, so the SFRA build toolchain is not installed here.
      - run: npm test
