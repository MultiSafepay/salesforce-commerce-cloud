# MultiSafepay forms resource overrides.
# Resource bundles merge across the cartridge path, so only the keys defined
# here override/extend the base app_storefront_base forms.properties.

# Range message for the relaxed postal code length (3-10 chars),
# used by the overridden address form which accepts alphanumeric postal codes.
error.message.between3and10=Must be between 3 to 10 characters required.

# Country labels for the extended address form country list.
# Only the keys missing from app_storefront_base/forms.properties are defined
# here; resource bundles merge across the cartridge path, so unitedstates,
# france, italy, netherlands, unitedkingdom and china keep the base values.
